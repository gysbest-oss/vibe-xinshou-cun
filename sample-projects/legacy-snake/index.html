<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>贪吃蛇 v0.1 - by 小王</title>
<style>
  body { font-family:"Microsoft YaHei",sans-serif; background:#1e2b1e; color:#cde8cd; max-width:460px; margin:20px auto; text-align:center; }
  h1 { font-size:22px; }
  #score { font-size:16px; margin:8px 0; }
  #wrap { position:relative; display:inline-block; }
  canvas { background:#0e180e; border:2px solid #4a7a4a; border-radius:6px; outline:none; display:block; }
  #mask { position:absolute; inset:0; background:rgba(10,20,12,.88); border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #mask .in { font-size:15px; line-height:2; color:#cde8cd; }
  #mask small { font-size:11px; color:#7a9a7a; }
  .pad { display:grid; grid-template-columns:repeat(3,58px); gap:6px; justify-content:center; margin:10px auto 4px; }
  .pk { height:46px; font-size:20px; padding:0; margin:0; background:#4a7a4a; border-radius:8px; }
  .pad span { display:block; }
  button.rst { padding:8px 22px; border:0; border-radius:4px; background:#4a7a4a; color:#fff; cursor:pointer; margin-top:6px; }
  .tip { font-size:12px; color:#7a9a7a; }
</style>
</head>
<body>
<h1>🐍 贪吃蛇</h1>
<div id="score">得分：0</div>
<div id="wrap">
  <canvas id="cv" width="400" height="400" tabindex="0"></canvas>
  <div id="mask"><div class="in">👆 点击开始<br>方向键 或 屏幕按钮 控制<br><small>（这是小王没写完的版本，据说有点毛病 😏）</small></div></div>
</div>
<div class="pad">
  <span></span><button class="pk" onclick="pad(0,-1)">↑</button><span></span>
  <button class="pk" onclick="pad(-1,0)">←</button><button class="pk" onclick="pad(0,1)">↓</button><button class="pk" onclick="pad(1,0)">→</button>
</div>
<div><button class="rst" onclick="reStart()">重新开始</button></div>
<p class="tip">方向键控制 · 吃到红色食物得分</p>
<script>
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var G = 20, N = 20;
var snake, dir, food, score, timer;

function start() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  score = 0;
  document.getElementById('score').innerText = '得分：0';
  food = makeFood();
  clearInterval(timer);
  timer = setInterval(step, 150);
  draw();
}

function makeFood() {
  return { x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N) };
}

function setDir(x, y) { dir = {x:x, y:y}; }
function pad(x, y) { setDir(x, y); }

document.addEventListener('keydown', function(e) {
  var m = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0]};
  if (m[e.key]) { e.preventDefault(); setDir(m[e.key][0], m[e.key][1]); }
});

function step() {
  var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) { over(); return; }
  for (var i = 0; i < snake.length; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) { over(); return; }
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').innerText = '得分：' + score;
    food = makeFood();
  } else {
    snake.pop();
  }
  draw();
}

function over() {
  clearInterval(timer);
  alert('游戏结束！得分：' + score);
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(food.x*G+3, food.y*G+3, G-6, G-6);
  for (var i = 0; i < snake.length; i++) {
    ctx.fillStyle = i === 0 ? '#8ee08e' : '#5aa85a';
    ctx.fillRect(snake[i].x*G+1, snake[i].y*G+1, G-2, G-2);
  }
}

/* 初始画面（未开始） */
snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
dir = {x:1,y:0};
score = 0;
food = makeFood();
draw();

document.getElementById('mask').onclick = function() {
  this.style.display = 'none';
  try { cv.focus(); } catch(e) {}
  try { window.focus(); } catch(e) {}
  start();
};
cv.addEventListener('click', function(){ try { window.focus(); } catch(e) {} });
</script>
</body>
</html>
